services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scm
      POSTGRES_PASSWORD: scm
      POSTGRES_DB: scm
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - db
  worker:
    build: ../backend
    command: python -m app.worker
volumes:
  pgdata:
