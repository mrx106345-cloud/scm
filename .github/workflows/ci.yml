name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "./backend[dev]"
      - name: Lint
        run: ruff check ./backend
      - name: Types
        run: mypy ./backend/app/core ./backend/app/agents ./backend/app/forecasting
      - name: Tests
        run: pytest ./backend -q
      - name: Security lint
        run: bandit -q -r ./backend/app
      - name: Dependency audit
        run: pip-audit --progress-bar=off
