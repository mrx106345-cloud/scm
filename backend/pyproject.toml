[project]
name = "scm-agent-backend"
version = "0.1.0"
description = "SCM Agent backend — on-premise supply-chain risk system"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "gunicorn==23.0.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "SQLAlchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg==3.2.3",
  "argon2-cffi==23.1.0",
  "PyJWT==2.10.1",
  "cryptography==44.0.0",
  "APScheduler==3.10.4",
  "pandas==2.2.3",
  "numpy==1.26.4",
  "openpyxl==3.1.5",
  "XlsxWriter==3.2.0",
  "statsmodels==0.14.4",
  "scikit-learn==1.6.0",
  "scipy==1.14.1",
  "PuLP==2.9.0",
  "rapidfuzz==3.10.1",
  "llama-cpp-python==0.3.9",
  "httpx==0.28.1",
  "reportlab==4.2.5",
  "matplotlib==3.10.0",
  "Jinja2==3.1.5",
  "structlog==24.4.0",
  "typer==0.15.1",
  "psutil==6.1.1",
  "lxml==5.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "pytest-asyncio==0.25.0",
  "hypothesis==6.124.0",
  "freezegun==1.5.1",
  "respx==0.22.0",
  "ruff==0.8.4",
  # 1.13.2 was never published on PyPI (the 1.13 line ends at 1.13.0); the
  # wrong pin made every CI environment fail dependency resolution.
  "mypy==1.13.0",
  "bandit==1.8.3",
  "pip-audit==2.7.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Flat layout: only ship the app package; alembic/ are migrations, not an
# importable distribution package (reproduced: setuptools otherwise errors
# with "Multiple top-level packages discovered in a flat-layout").
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "UP"]
"tools/**" = ["S"]
# S320: lxml XML parsing of ERP-supplied XML is the connector's job; the parser
# is already hardened (resolve_entities=False, no_network=True) and the golden
# tests cover malformed/hostile XML. Ignore the blanket rule, keep the mitigations.
"app/connectors/tally.py" = ["S320"]

[tool.mypy]
python_version = "3.11"
strict = true
# warn_unused_ignores: mypy 1.13 (pinned) needs the app/llm/backends.py
# ignores, mypy 2.x flags them as unused. Tolerate until the pins move.
warn_unused_ignores = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lxml/openpyxl ship no py.typed marker; treat as Any (no new dev deps --
# agent boundary: dependency additions need owner approval).
module = ["lxml.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.coverage.run]
source = ["app"]
